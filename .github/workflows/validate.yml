name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every skill has valid frontmatter
        run: |
          fail=0
          count=0
          for f in packs/*/*/SKILL.md; do
            count=$((count + 1))
            head -1 "$f" | grep -q '^---$' || { echo "$f: missing frontmatter opener"; fail=1; }
            grep -q '^name: ' "$f"        || { echo "$f: missing 'name'"; fail=1; }
            grep -q '^description: ' "$f" || { echo "$f: missing 'description'"; fail=1; }

            dir=$(basename "$(dirname "$f")")
            name=$(grep -m1 '^name: ' "$f" | sed 's/^name: //')
            [ "$dir" = "$name" ] || { echo "$f: name '$name' != directory '$dir'"; fail=1; }
          done
          # A glob matching nothing would pass every check above. This is the
          # vacuous-pass guard for the guard checker.
          [ "$count" -gt 0 ] || { echo "no skills found — the layout moved"; fail=1; }
          echo "checked $count skills"
          exit $fail

      - name: Commands have frontmatter and a description
        run: |
          fail=0
          for f in commands/*.md; do
            head -1 "$f" | grep -q '^---$'   || { echo "$f: missing frontmatter opener"; fail=1; }
            grep -q '^description: ' "$f"    || { echo "$f: missing 'description'"; fail=1; }
          done
          exit $fail

      - name: README lists every shipped guard
        run: |
          fail=0
          for d in packs/*/*/; do
            name=$(basename "$d")
            grep -q "\*\*$name\*\*" README.md || { echo "README.md does not list guard '$name'"; fail=1; }
          done
          exit $fail

      - name: Shell scripts parse
        run: |
          for f in install.sh $(find packs -name '*.sh'); do
            bash -n "$f" || { echo "$f failed to parse"; exit 1; }
          done

      - name: plugin.json is valid JSON and version matches CHANGELOG
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          grep -q "^## $v" CHANGELOG.md || { echo "CHANGELOG.md has no entry for version $v"; exit 1; }

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer copies every pack into a clean home
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude"
          ./install.sh
          # Compare against the repo rather than a hardcoded list, so a new
          # guard that the installer fails to copy is caught automatically.
          expected=$(find packs -name SKILL.md | wc -l)
          actual=$(find "$CLAUDE_HOME/skills" -name SKILL.md | wc -l)
          [ "$expected" -eq "$actual" ] || { echo "installed $actual of $expected skills"; exit 1; }
          echo "installed $actual skills"
          for c in guard timecheck; do
            test -f "$CLAUDE_HOME/commands/$c.md" || { echo "missing command: $c"; exit 1; }
          done

      - name: Re-running the installer is safe
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude"
          ./install.sh | grep -q "skip" || { echo "second run should skip existing files"; exit 1; }

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A guard nobody has watched fail is a decoration with a green checkmark.
      - name: native-controls trips on every known shape
        working-directory: packs/design/native-controls/checks
        run: |
          bash ../../../build/guard-integrity/checks/mutation-harness.sh \
            "SCAN_DIRS=src bash $PWD/no-native-controls.sh" ./fixtures
